# Optional nginx example only. krystalbbs.net runs Caddy on :80 and :443;
# nginx is not installed. Prefer deploy/caddy/egnooz.krystalbbs.net.caddy.
# Do not assume /etc/nginx/sites-available (Debian layout). If you ever use
# nginx, drop this server block into whatever directory already holds vhosts.
#
# Do not replace the existing krystalbbs.net site.
# App: systemd user egnooz-review.service on 127.0.0.1:8080.

server {
    listen 80;
    listen [::]:80;
    server_name egnooz.krystalbbs.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
