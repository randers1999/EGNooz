# Extra nginx vhost for EGNooz on the same box as krystalbbs.net.
# Do not replace the existing krystalbbs.net site (BBS or otherwise).
#
# Default subdomain: egnooz.krystalbbs.net
# To rename: replace egnooz.krystalbbs.net in this file, rename the file to
# match, and set REVIEW_BASE_URL in /home/egnooz/.config/egnooz/egnooz.env
# to https://<that-host>. install.sh will not overwrite that env file.
#
# DNS (same addresses as krystalbbs.net):
#   egnooz.krystalbbs.net.   A      <IPv4 of krystalbbs.net>
#   egnooz.krystalbbs.net.   AAAA   <IPv6 of krystalbbs.net, if any>
#   # or CNAME:  egnooz.krystalbbs.net.  CNAME  krystalbbs.net.
#
# Enable as root (leaves the apex vhost alone):
#   sudo cp deploy/nginx/egnooz.krystalbbs.net.conf /etc/nginx/sites-available/
#   sudo ln -sf /etc/nginx/sites-available/egnooz.krystalbbs.net.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (Let's Encrypt). Run after DNS resolves to this box:
#   sudo certbot --nginx -d egnooz.krystalbbs.net
# certbot adds listen 443 and ssl_certificate lines. Until then this vhost
# is HTTP-only so nginx -t succeeds without cert files.
#
# App: Unix user egnooz, 127.0.0.1:8080. Do not paste secrets here.

server {
    listen 80;
    listen [::]:80;
    server_name egnooz.krystalbbs.net;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
