# Example reverse proxy for EGNooz on the VPS hostname krystalbbs.net.
# Do not paste secrets here. Terminate TLS with the certificates you already use
# on this host (certbot, caddy, etc.).
#
# If krystalbbs.net already serves another site (for example a BBS), do not
# replace that vhost. Use a location prefix or a subdomain and set
# REVIEW_BASE_URL in ~/.config/egnooz/egnooz.env to match.
#
# App listen: 127.0.0.1:8080 (see EGNOOZ_BIND / EGNOOZ_PORT).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name krystalbbs.net;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    # Private review UI, login, publish — plus public JSON after Publish.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name krystalbbs.net;
    return 301 https://krystalbbs.net$request_uri;
}
