[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egnooz"
version = "0.1.0"
description = "Daily East Gippsland news edition: ingest, review, and publish"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "LicenseRef-Proprietary"}
authors = [{name = "Tom Aberdeen"}]
dependencies = [
    "feedparser>=6.0.11",
    "PyYAML>=6.0.2",
    "flask>=3.0.3",
    "httpx>=0.27.2",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.0.1",
    "waitress>=3.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.3"]

[project.scripts]
egnooz = "egnooz.cli:main"

[tool.setuptools.packages.find]
include = ["egnooz*"]

[tool.setuptools.package-data]
egnooz = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
